# Replace YOUR_USERNAME (lowercase) before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-pulse
spec:
  replicas: 2
  selector:
    matchLabels: { app: sales-pulse }
  template:
    metadata:
      labels: { app: sales-pulse }
    spec:
      containers:
        - name: web
          image: ghcr.io/YOUR_USERNAME/sales-pulse:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sales-pulse
spec:
  type: LoadBalancer
  selector: { app: sales-pulse }
  ports:
    - port: 80
      targetPort: 5000
